[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "stoa"
version = "0.1.0"
description = "Robust portfolio allocation under model uncertainty"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "ak495867" }]
license = { text = "MIT" }
dependencies = ["numpy>=1.26"]

[project.scripts]
stoa = "stoa.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/stoa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
